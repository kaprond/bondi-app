    <style id="expo-reset">
      html, body { height: 100%; margin: 0; }
      body { overflow: hidden; background: radial-gradient(120% 80% at 50% 0%, #54B8CE, #0095B6); }
      #root { display: flex; height: 100%; flex: 1; max-width: 480px; margin: 0 auto; background: #F1F9FB; }
      #desk-hint { display: none; position: fixed; left: 24px; bottom: 20px; color: #fff; font: 600 13px/1.4 system-ui, sans-serif; opacity: .85; }
      /* Desktop: show the app as a phone in the middle of the page */
      @media (min-width: 600px) and (min-height: 760px) {
        #root { max-width: 430px; height: min(900px, calc(100% - 48px)); margin: 24px auto; border-radius: 36px; overflow: hidden;
          box-shadow: 0 30px 80px rgba(0, 40, 50, .45), 0 0 0 10px rgba(255, 255, 255, .14); }
        #desk-hint { display: block; }
      }
    </style>
  </head>

  <body>
    <noscript>bondi needs JavaScript to run.</noscript>
    <div id="root"></div>
    <div id="desk-hint">↑ ↓ to scroll clips · best on your phone</div>
    <script>
      // keep the install prompt for src/install.ts (it fires before the app has loaded)
      window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__bondiInstall = e; });
      window.addEventListener('appinstalled', function () { window.__bondiInstall = null; });
      if ('serviceWorker' in navigator && location.protocol === 'https:') {
        window.addEventListener('load', function () { navigator.serviceWorker.register('/sw.js').catch(function () {}); });
      }
    </script>
  </body>
